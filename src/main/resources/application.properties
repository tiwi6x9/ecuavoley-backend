spring.application.name=ecuavoley-backend

# Carga application-local.properties si existe (no se sube a git).
# Ahi va la contraseña real de tu Postgres local.
spring.config.import=optional:application-local.properties

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ecuavoley_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# ==========================================
# ADMIN
# ==========================================
ecuavoley.admin.code=${ADMIN_CODE}

# ==========================================
# CORS (version web)
# ==========================================
# Dominios permitidos para llamar a la API desde un navegador,
# separados por comas (ej: https://ecuavoley.netlify.app). Vacio por
# defecto: no afecta a la app Android ni a nada existente hasta que
# se configure explicitamente en Railway.
ecuavoley.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
